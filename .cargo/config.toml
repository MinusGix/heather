# Link with mold. The elab crate has ~150 integration test binaries, each
# linking the whole compiler, so link time is most of a cold compile; mold
# is installed on the desktop (NixOS) and on the furnace box (cloud-init
# symlinks ld.mold into /usr/local/bin). Every host that builds this repo
# needs `ld.mold` on PATH; drop the flag with CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUSTFLAGS=""
# for a host without it. mold reserves ~8 GiB of address space per link, so
# never link inside a `ulimit -v` below that: the repo scripts build with
# `--no-run` first and enter the 4 GiB test cap afterwards; an ad-hoc
# `(ulimit -v 4194304; cargo test …)` fails with "cannot reserve … bytes".
[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "link-arg=-fuse-ld=mold"]

# The elaborator's incremental builds skip rustc's cross-unit optimisation
# pass; the script says why and passes every other crate through untouched
# (issues/elaborator-crate-compile-per-edit.md). Cargo has no per-package
# `lto`, and a profile-wide `lto = "off"` slows the kernel by a fifth.
[build]
rustc-workspace-wrapper = "scripts/rustc-wrapper"
