[package]
name = "tree-sitter-heather"
description = "Heather grammar for tree-sitter"
version = "0.1.0"
authors = ["Heather contributors"]
license = "MIT OR Apache-2.0"
readme = "README.md"
keywords = ["incremental", "parsing", "tree-sitter", "heather"]
categories = ["parser-implementations", "parsing", "text-editors"]
repository = "https://github.com/minusgix/heather"
edition = "2021"
autoexamples = false

build = "bindings/rust/build.rs"
include = [
  "bindings/rust/*",
  "grammar.js",
  "queries/*",
  "src/*",
  "tree-sitter.json",
]

[lib]
path = "bindings/rust/lib.rs"

[dependencies]
tree-sitter-language = "0.1"

[build-dependencies]
cc = "1.2"

[dev-dependencies]
tree-sitter = "0.25.10"

# This grammar is a standalone package nested in Heather's Rust workspace.
[workspace]
