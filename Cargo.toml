[workspace]
resolver = "2"
members = ["crates/numeral", "crates/sat", "crates/kernel", "crates/kernel-lib", "crates/run", "crates/syntax", "crates/elab", "crates/elab-lib", "crates/elab-unit", "crates/cache", "crates/linked", "crates/cli", "crates/lsp", "crates/export"]

[workspace.package]
version = "0.0.1"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.lints.rust]
unsafe_code = "forbid"

# The full-library elab test runs deep kernel conversion against scripts/test's
# 300 CPU-second rail; unoptimized it pays ~6x over release for no diagnostic
# gain. Optimize the hot crates even in dev builds — debug-assertions and
# overflow-checks stay on (profile.dev defaults), only codegen changes.
# Line tables only: the elab crate has ~150 integration test binaries, each
# linking the whole compiler, and full DWARF made every one ~100 MB, so the
# cold fast lane spent longer linking than testing (compile 323 s vs tests
# 227 s, 2026-09-11). Backtraces and panic locations keep file:line; a
# debugger session that needs variables sets CARGO_PROFILE_DEV_DEBUG=2 for
# that one build.
[profile.dev]
debug = "line-tables-only"

[profile.dev.package.heather-kernel-lib]
opt-level = 3

[profile.dev.package.heather-elab-lib]
opt-level = 3

# `heather-kernel` and `heather-elab` themselves (crates/kernel, crates/elab:
# the integration tests and the benches) are deliberately absent: their test
# binaries only drive the optimized libraries, and at opt-level 3 they cost
# 5-9x the CPU of opt-level 0 (issues/fresh-container-compile-cost.md).

# The same sources as heather-elab, compiled for its unit tests
# (crates/elab-unit/Cargo.toml).
[profile.dev.package.heather-elab-unit]
opt-level = 3

[profile.dev.package.heather-syntax]
opt-level = 3

# The untrusted evaluator runs whole optimizer walks: an interpreter loop,
# which unoptimized costs many times its release speed.
[profile.dev.package.heather-run]
opt-level = 3

# The allocator's C sources: at the dev profile's opt-level 0 every `malloc`
# in every test binary would run unoptimized (issues/global-allocator.md).
[profile.dev.package.libmimalloc-sys]
opt-level = 3

# The cache renders and hashes every elaborated declaration (SHA-256 over
# `write_exact` output), which is the same order of work as the kernel gate it
# is meant to avoid; unoptimized it would dominate its own tests.
[profile.dev.package.heather-cache]
opt-level = 3

# The exporter walks and prints every exported term; unoptimized, the library
# sweep (crates/export/tests/library_sweep.rs) spent nearly all of its time
# here rather than elaborating, and was the full lane's longest test.
[profile.dev.package.heather-export]
opt-level = 3
