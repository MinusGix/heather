[package]
name = "heather-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
# The bench target is declared explicitly below; nothing else under benches/
# is one (the suite is a directory of modules, not a file per benchmark).
autobenches = false

# No lib target: src/ is the `heather-kernel-lib` package's
# (crates/kernel-lib/Cargo.toml, which also runs its unit tests), so this
# package's integration tests compile at the dev profile's opt-level 0 while
# the kernel they drive keeps opt-level 3.
autolib = false

[features]
value-metrics = ["heather-kernel-lib/value-metrics"]
long-checks = ["heather-kernel-lib/long-checks"]

[dependencies]
heather-kernel-lib = { path = "../kernel-lib" }

# Run through scripts/bench (ulimit), not `cargo bench` directly —
# docs/infrastructure/benchmarking.md.
[[bench]]
name = "kernel"
path = "benches/kernel/main.rs"
harness = false

[lints]
workspace = true
