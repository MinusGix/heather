[package]
name = "heather-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
# The bench target is declared explicitly below; nothing else under benches/
# is one (the suite is a directory of modules, not a file per benchmark).
autobenches = false

[lib]
name = "heather_kernel"

# Still zero dependencies, dev-dependencies included: no Criterion. See
# issues/dependency-policy.md and the module docs in
# benches/kernel/harness.rs for why the estimator is first-party.
[dependencies]

# Run through scripts/bench (ulimit), not `cargo bench` directly —
# docs/benchmarking.md.
[[bench]]
name = "kernel"
path = "benches/kernel/main.rs"
harness = false

[lints]
workspace = true
