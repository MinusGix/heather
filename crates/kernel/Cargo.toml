[package]
name = "heather-kernel"
version.workspace = true
edition.workspace = true
license.workspace = true
# The bench target is declared explicitly below; nothing else under benches/
# is one (the suite is a directory of modules, not a file per benchmark).
autobenches = false

[lib]
name = "heather_kernel"

[features]
value-metrics = []
# Every slow self-check on every occasion (src/checks.rs); the `--long`
# lane of scripts/test. Debug builds only have anything to switch.
long-checks = []

[dependencies]
heather-numeral = { path = "../numeral" }
typed-arena = "=2.0.2"

# Run through scripts/bench (ulimit), not `cargo bench` directly —
# docs/benchmarking.md.
[[bench]]
name = "kernel"
path = "benches/kernel/main.rs"
harness = false

[lints]
workspace = true
