[package]
name = "heather-elab-unit"
version.workspace = true
edition.workspace = true
license.workspace = true
publish = false
autotests = false
autobenches = false
autoexamples = false
autobins = false

# `heather-elab`'s in-crate unit tests, compiled from that crate's own
# sources. They live in a package of their own because Cargo cannot scope a
# dev-dependency to one target: `heather-elab` dev-depends on `heather-cli`
# (for its integration tests and bench), which depends on `heather-elab`, so
# its `--lib` test build could not start until the elab → cli chain was
# built, and it was then the whole build's critical path
# (issues/elab-unit-tests-wait-on-cli-dev-dependency.md). With no
# dev-dependencies here it compiles beside the elab lib instead of after it.
# Run with `scripts/test -p heather-elab-unit --lib`.
[lib]
name = "heather_elab_unit"
path = "../elab/src/lib.rs"
doctest = false

[features]
value-metrics = ["heather-kernel-lib/value-metrics"]

[dependencies]
heather-kernel-lib = { path = "../kernel-lib" }
heather-numeral = { path = "../numeral" }
heather-syntax = { path = "../syntax" }
# The process allocator (`ALLOC` in crates/elab/src/lib.rs; issues/global-allocator.md).
# mimalloc 2, not 3: Rust states an alignment with every request, and
# mimalloc 3 takes its ordinary path for an aligned request only when the
# size class is a power of two. Any other size is over-allocated into the
# next class up whenever its own class's free list is empty, so a syntax
# node (ten words a type, fourteen a term) would not get the class its
# size earns.
mimalloc = { version = "0.1.52", default-features = false, features = ["v2"] }

[lints]
workspace = true
