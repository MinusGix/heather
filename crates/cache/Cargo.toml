[package]
name = "heather-cache"
version.workspace = true
edition.workspace = true
license.workspace = true
build = "build.rs"

[lib]
name = "heather_cache"

# Zero SHIPPED dependencies — for this crate the reason is not the workspace
# default but a trust argument of its own: believing a cache entry is believing
# its hash, so the hash is first-party (docs/cache-v1-design.md §2,
# issues/dependency-policy.md).
[dependencies]
heather-kernel = { path = "../kernel" }
heather-elab = { path = "../elab" }

# `sha2` is a DEV-dependency and exists for exactly one reason: to disagree
# with us. `tests/sha256.rs` runs our SHA-256 against it differentially over
# every length through the padding boundaries, multi-block inputs, and
# adversarial chunkings. Depending on it would give away the trust argument
# above; *testing against* it strengthens it — "pinned to the published
# vectors" becomes "byte-identical to an independent implementation on
# thousands of inputs the vectors do not cover". Nothing shipped links it.
[dev-dependencies]
sha2 = "0.10"

# `deny` where the workspace says `forbid`, for one reason: the SHA-256
# compression function has a hardware path (`src/sha256.rs`,
# `compress_blocks_sha`) whose intrinsic call needs an `unsafe` block, and
# `forbid` admits no `allow` beneath it. The two functions that carry it are
# the only `#[allow(unsafe_code)]` in the workspace; everything else in this
# crate is still refused (2026-09-17, issues/merkle-walk-cold-share.md).
[lints.rust]
unsafe_code = "deny"
