[package]
name = "heather-elab"
version.workspace = true
edition.workspace = true
license.workspace = true
# The bench target is declared explicitly below; nothing else under benches/
# is one (the suite is a directory of modules, not a file per benchmark) —
# same shape as the kernel's.
autobenches = false
# Integration tests are declared below, not discovered: most of
# tests/*.rs are members of a family binary that mounts them by path
# (docs/elab-test-families-design.md), so a file per binary no longer holds.
# scripts/check-elab-test-families.mjs fails the suite on a file no target
# builds.
autotests = false

# No lib target: src/ is the `heather-elab-lib` package's
# (crates/elab-lib/Cargo.toml), so this package's integration tests compile at
# the dev profile's opt-level 0 while the library they drive keeps opt-level 3.
# The unit tests in src/ build and run as the `heather-elab-unit` package
# (crates/elab-unit/Cargo.toml), which has none of the dev-dependencies below.
autolib = false

[features]
value-metrics = ["heather-elab-lib/value-metrics"]

[dependencies]
heather-elab-lib = { path = "../elab-lib" }
heather-kernel-lib = { path = "../kernel-lib" }
heather-numeral = { path = "../numeral" }
heather-syntax = { path = "../syntax" }

# First-party only, and no Criterion: the frontend suite reuses the kernel
# harness's first-party estimator (issues/dependency-policy.md,
# docs/frontend-benchmarking.md). Run through `scripts/bench-frontend`
# (ulimit), never `cargo bench` directly.
#
# `heather-cache` is the workspace's own crate (the cache depends on the
# library's `gate` seam, and this package's *tests* install it there; a
# dev-dependency cycle before the library moved to `heather-elab-lib`): tests
# gate their shared library prefix through the declaration cache so binaries
# stop re-checking identical work (issues/elaborator-snapshot-across-test-binaries.md;
# the helper is `with_decl_cache` in tests/support/mod.rs).
#
# `heather-cli` is here for the same kind of reason: the frontend bench computes its corpus's import closures
# with the CLI's own loader instead of a hand-written list of module names,
# which is what went stale in issues/frontend-bench-ir-closure-stale.md.
[dev-dependencies]
heather-cache = { path = "../cache" }
heather-cli = { path = "../cli" }
[[bench]]
name = "frontend"
path = "benches/frontend/main.rs"
harness = false

# One binary per family; the runner still runs each member file in a process
# of its own (docs/elab-test-families-design.md). The families mount their
# members from tests/*.rs, so every file keeps its path.
[[test]]
name = "family_inductive"
path = "tests/families/inductive.rs"
[[test]]
name = "family_function_ir"
path = "tests/families/function_ir.rs"
[[test]]
name = "family_indexed"
path = "tests/families/indexed.rs"
[[test]]
name = "family_library"
path = "tests/families/library.rs"
[[test]]
name = "family_literals"
path = "tests/families/literals.rs"
[[test]]
name = "family_logic"
path = "tests/families/logic.rs"
[[test]]
name = "family_matching"
path = "tests/families/matching.rs"
[[test]]
name = "family_omega"
path = "tests/families/omega.rs"
[[test]]
name = "family_session"
path = "tests/families/session.rs"
[[test]]
name = "family_surface"
path = "tests/families/surface.rs"
[[test]]
name = "family_traits"
path = "tests/families/traits.rs"
[[test]]
name = "family_types"
path = "tests/families/types.rs"
[[test]]
name = "family_x86"
path = "tests/families/x86.rs"

# Standalone on purpose: the bench smoke times itself and runs exclusively,
# and scripts/test runs the warm-ups by name, before the parallel phase.
[[test]]
name = "frontend_bench_smoke"
path = "tests/frontend_bench_smoke.rs"
[[test]]
name = "semantic_omega_warmup"
path = "tests/semantic_omega_warmup.rs"
[[test]]
name = "semantic_x86_warmup"
path = "tests/semantic_x86_warmup.rs"

[lints]
workspace = true
[[test]]
name = "semantic_parser_warmup"
path = "tests/semantic_parser_warmup.rs"
