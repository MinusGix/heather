[package]
name = "heather-elab"
version.workspace = true
edition.workspace = true
license.workspace = true
# The bench target is declared explicitly below; nothing else under benches/
# is one (the suite is a directory of modules, not a file per benchmark) —
# same shape as the kernel's.
autobenches = false

[lib]
name = "heather_elab"

[dependencies]
heather-kernel = { path = "../kernel" }
heather-syntax = { path = "../syntax" }

# First-party only, and no Criterion: the frontend suite reuses the kernel
# harness's first-party estimator (issues/dependency-policy.md,
# docs/frontend-benchmarking.md). Run through `scripts/bench-frontend`
# (ulimit), never `cargo bench` directly.
#
# `heather-cache` is the workspace's own crate (a dev-dependency cycle Cargo
# supports: the cache depends on this crate's `gate` seam, and this crate's
# *tests* install it there): the certgen test family gates its shared library
# prefix through the declaration cache so six binaries stop re-checking
# identical work (issues/elaborator-snapshot-across-test-binaries.md; the
# helper is `with_decl_cache` in tests/support/mod.rs).
#
# `heather-cli` is here for the same kind of reason and it is the same kind of
# cycle: the frontend bench corpus computes `lib/ir_v1.hthr`'s import closure
# with the CLI's own loader instead of a hand-written list of module names,
# which is what went stale in issues/frontend-bench-ir-closure-stale.md.
[dev-dependencies]
heather-cache = { path = "../cache" }
heather-cli = { path = "../cli" }
[[bench]]
name = "frontend"
path = "benches/frontend/main.rs"
harness = false

[lints]
workspace = true
