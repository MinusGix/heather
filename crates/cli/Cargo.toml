[package]
name = "heather-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# The loader is shared with the frontend bench corpus (see src/lib.rs); the
# binary is the only other consumer.
[lib]
name = "heather_cli"
path = "src/lib.rs"

[[bin]]
name = "heather"
path = "src/main.rs"

[dependencies]
heather-kernel-lib = { path = "../kernel-lib" }
heather-numeral = { path = "../numeral" }
heather-syntax = { path = "../syntax" }
heather-elab-lib = { path = "../elab-lib" }
heather-cache = { path = "../cache" }

# Heather's own scanner, compiled and linked (`crates/linked`): what
# `HEATHER_LEXER=linked` hands the lexer (`src/main.rs`,
# `issues/self-lexer-linked.md`). The compiled code is x86-64 Linux's.
[target.'cfg(all(target_arch = "x86_64", target_os = "linux"))'.dependencies]
heather-linked = { path = "../linked" }

# `--limits` / `HEATHER_LIMITS` set the process's own resource limits with
# `setrlimit` (`src/limits.rs`).
[target.'cfg(unix)'.dependencies]
libc = "0.2"

[features]
value-metrics = ["heather-elab-lib/value-metrics"]

# `deny` where the workspace says `forbid`, for one reason: `--limits` calls
# `getrlimit`/`setrlimit` (`src/limits.rs`, `lower`), and `forbid` admits no
# `allow` beneath it. That function is the crate's only
# `#[allow(unsafe_code)]`; everything else is still refused, as in
# `crates/cache` and `crates/linked`.
[lints.rust]
unsafe_code = "deny"
