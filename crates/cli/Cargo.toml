[package]
name = "heather-cli"
version.workspace = true
edition.workspace = true
license.workspace = true

# The loader is shared with the frontend bench corpus (see src/lib.rs); the
# binary is the only other consumer.
[lib]
name = "heather_cli"
path = "src/lib.rs"

[[bin]]
name = "heather"
path = "src/main.rs"

[dependencies]
heather-kernel = { path = "../kernel" }
heather-syntax = { path = "../syntax" }
heather-elab = { path = "../elab" }
heather-cache = { path = "../cache" }

[features]
value-metrics = ["heather-elab/value-metrics"]

[lints]
workspace = true
